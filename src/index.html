<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a63e7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <title>Guess the Word</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section id="screen-start" class="card">
      <h1>Guess the Word</h1>
      <p class="sub">Match each word you know with its translation. Beat the clock across 100 levels.</p>
      <div class="row">
        <label>I speak <select id="sel-native"></select></label>
        <label>I want to learn <select id="sel-target"></select></label>
      </div>
      <p id="progress-info" class="sub"></p>
      <div class="row">
        <button id="btn-start" class="primary">Start</button>
        <button id="btn-practice">Practice failed words (0)</button>
      </div>
      <div class="row">
        <button id="btn-stats" class="ghost">Statistics</button>
        <button id="btn-reset" class="ghost">Reset progress</button>
      </div>
      <p id="version" class="version"></p>
    </section>

    <section id="screen-game" class="hidden">
      <header class="hud">
        <div id="hud-label"></div>
        <div>Score <strong id="hud-score">0</strong></div>
        <div>Time <strong id="hud-time">0</strong>s</div>
        <button id="btn-quit" class="ghost small">Menu</button>
      </header>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="panels">
        <div class="panel"><h2 id="title-native"></h2><ul id="list-native"></ul></div>
        <div class="panel"><h2 id="title-target"></h2><ul id="list-target"></ul></div>
      </div>
    </section>

    <section id="screen-stats" class="card hidden">
      <h1>Statistics</h1>
      <p id="stats-pair" class="sub"></p>
      <div id="stats-tiles" class="tiles"></div>
      <h2 class="sub">Hardest words</h2>
      <table class="hard"><tbody id="stats-hard"></tbody></table>
      <div class="row">
        <button id="btn-stats-back" class="primary">Back</button>
        <button id="btn-stats-reset" class="ghost">Reset statistics</button>
      </div>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <div class="row">
          <button id="ov-primary" class="primary"></button>
          <button id="ov-secondary" class="ghost">Menu</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/version.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
